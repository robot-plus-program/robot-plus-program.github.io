title: 협업지능실증개발지원센터
lang: ko
description: 협업지능기반 로봇플러스 사업

theme: minima

header_pages:
  - About-Us/README.md
  - About-Program/README.md
  - Support-for-Enterprises/README.md

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# debug:
#   compress: false
#   dist: false
#   extension: true

sass:
  style: compress

plugins:
  - jemoji
  - jekyll-avatar
  - jekyll-mentions

exclude:
  - Makefile
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - requirements.txt
  - node_modules
  - package.json
  - package-lock.json
  - webpack.config.js
